# Telegraf in the DMZ. It reads the fleet through the read-only Modbus gateway
# on its own fixed schedule and serves the readings for Prometheus to scrape.
#
# Prometheus never reaches the gateway or a device. It can't choose what gets
# polled or how often, so nothing on the IT side can generate traffic into OT.
# (A blackbox-style exporter that takes the target as a scrape parameter would
# let it, which is why this lab doesn't use one.)
#
# The per-device inputs are generated into telegraf.d/devices.conf.

[agent]
  # How often each device is read. Field devices get polled gently; in a real
  # plant this interval is agreed with whoever owns the equipment.
  interval = "10s"
  round_interval = true
  collection_jitter = "0s"
  flush_interval = "10s"
  omit_hostname = true

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  # A device that stops answering drops out of /metrics after a minute, instead
  # of its last values being served forever as if they were current.
  expiration_interval = "60s"
  # Telegraf's Go runtime and process metrics aren't what this lab is about
  collectors_exclude = ["gocollector", "process"]

# Telegraf's statistics about itself, one series per input. A device's
# internal_gather_metrics_gathered stops increasing the moment reads from it
# fail, while the series itself stays put: the "no data" signal.
[[inputs.internal]]
  collect_memstats = false
  namepass = ["internal_gather"]
  tagexclude = ["version"]