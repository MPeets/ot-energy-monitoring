# GENERATED by `python -m fleet.collector_config` from inventory.toml and
# fleet/register_map.toml. Don't edit by hand: change those and run
# scripts/generate-collector-config.sh. A unit test fails if this file is stale.
#
# One Modbus input per device, all through the read-only gateway. Separate
# inputs keep a dead device from holding up the others, and give each device
# its own gather statistics, which is how monitoring tells "no data" apart
# from "zero output".

[[inputs.modbus]]
  alias = "wt-01"
  name = "wt-01"
  controller = "tcp://modbus-gateway:502"
  configuration_type = "request"
  exclude_register_type_tag = true
  timeout = "2s"
  tagexclude = ["name", "slave_id"]

  [[inputs.modbus.request]]
    slave_id = 11
    register = "input"
    byte_order = "ABCD"
    measurement = "fleet"
    fields = [
      { address = 0, name = "heartbeat_seconds", type = "UINT32" },
      { address = 2, name = "device_type", type = "UINT16", omit = true },
      { address = 3, name = "map_version", type = "UINT16" },
      { address = 10, name = "frequency_hertz", type = "UINT16", scale = 0.001 },
      { address = 11, name = "voltage_l1_volts", type = "FLOAT32" },
      { address = 13, name = "voltage_l2_volts", type = "FLOAT32" },
      { address = 15, name = "voltage_l3_volts", type = "FLOAT32" },
      { address = 17, name = "voltage_nominal_volts", type = "FLOAT32" },
      { address = 19, name = "active_power_watts", type = "INT16", scale = 1000.0 },
      { address = 20, name = "reactive_power_var", type = "INT16", scale = 1000.0 },
      { address = 21, name = "rated_power_watts", type = "UINT16", scale = 1000.0 },
      { address = 30, name = "wind_speed_meters_per_second", type = "UINT16", scale = 0.01 },
      { address = 31, name = "state", type = "UINT16" },
      { address = 32, name = "rotor_speed_rpm", type = "UINT16", scale = 0.1 },
    ]
    [inputs.modbus.request.tags]
      device = "wt-01"
      device_type = "turbine"
      site = "wind-a"

  [[inputs.modbus.request]]
    slave_id = 11
    register = "holding"
    byte_order = "ABCD"
    measurement = "fleet"
    fields = [
      { address = 0, name = "power_limit_ratio", type = "UINT16", scale = 0.001 },
    ]
    [inputs.modbus.request.tags]
      device = "wt-01"
      device_type = "turbine"
      site = "wind-a"

