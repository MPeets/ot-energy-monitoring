# The fleet as the monitoring side knows it: every device the gateway routes to
# and the collector polls. This is the asset list. If a device is in here and
# isn't reporting, that's an incident; if it isn't in here, monitoring doesn't
# know it exists.
#
# unit: the Modbus unit id the DMZ uses to address the device through the
# gateway. Numbered by site so they're easy to read: 1x wind, 2x solar,
# 3x storage, 4x substation.

[[device]]
id = "wt-01"
unit = 11
site = "wind-a"
type = "turbine"

