name: power-fleet

# Applied to every service: read-only root filesystem (with a small in-memory
# /tmp), no privilege escalation, no Linux capabilities and bounded log files.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# The repo's Python code runs on the stock image, mounted read-only. Nothing to
# build, and no packages to download: it's all standard library.
x-python: &python
  <<: *hardening
  image: python:${PYTHON_VERSION:-3.12.11-alpine3.22}
  user: "65534:65534"
  init: true
  working_dir: /app
  volumes:
    - ./fleet:/app/fleet:ro
  mem_limit: 64m
  cpus: 0.25

# A simulated field device. Modbus TCP listens on the standard port 502; the
# sysctl lets a non-root process bind it without granting a capability.
# scenarios/ is how the lab changes the physical world (see scenarios/README.md).
x-device: &device
  <<: *python
  command: ["python", "-u", "-B", "-m", "fleet.device"]
  volumes:
    - ./fleet:/app/fleet:ro
    - ./scenarios:/scenarios:ro
  sysctls:
    net.ipv4.ip_unprivileged_port_start: 0
  networks: [ot]

services:
  # Wind park A: three 3.6 MW turbines sharing one wind field
  wt-01:
    <<: *device
    environment:
      DEVICE_TYPE: turbine
      DEVICE_ID: wt-01
      SITE: wind-a

  wt-02:
    <<: *device
    environment:
      DEVICE_TYPE: turbine
      DEVICE_ID: wt-02
      SITE: wind-a

  wt-03:
    <<: *device
    environment:
      DEVICE_TYPE: turbine
      DEVICE_ID: wt-03
      SITE: wind-a

  # Solar park B: two 2.5 MW central inverters, 3 MWp of modules each
  inv-01:
    <<: *device
    environment:
      DEVICE_TYPE: inverter
      DEVICE_ID: inv-01
      SITE: solar-b

  inv-02:
    <<: *device
    environment:
      DEVICE_TYPE: inverter
      DEVICE_ID: inv-02
      SITE: solar-b

# Storage site C: 5 MW / 10 MWh battery, trading schedule plus frequency response
  bess-01:
    <<: *device
    environment:
      DEVICE_TYPE: battery
      DEVICE_ID: bess-01
      SITE: bess-c

  # Substation D, the point of connection: 110/20 kV, 25 MVA. Its RTU polls
  # every feeder for active power and reports what the fleet exports.
  sub-01:
    <<: *device
    environment:
      DEVICE_TYPE: substation
      DEVICE_ID: sub-01
      SITE: sub-d
      FEEDERS: wt-01,wt-02,wt-03,inv-01,inv-02,bess-01

  # The conduit between OT and the DMZ, and the only service on both networks.
  # Routes requests by unit id (inventory.toml) and passes reads only.
  modbus-gateway:
    <<: *python
    command: ["python", "-u", "-B", "-m", "fleet.gateway"]
    volumes:
      - ./fleet:/app/fleet:ro
      - ./inventory.toml:/app/inventory.toml:ro
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    networks: [ot, ot-dmz]

  # The collector, in the DMZ. Reads every device through the gateway on its
  # own schedule and serves the readings for Prometheus. It sits on the two
  # conduits only, never on the OT network itself.
  collector:
    <<: *hardening
    image: telegraf:${TELEGRAF_VERSION:-1.40.2-alpine}
    user: telegraf
    command: ["telegraf", "--config", "/etc/telegraf/telegraf.conf", "--config-directory", "/etc/telegraf/telegraf.d"]
    volumes:
      - ./collector:/etc/telegraf:ro
    networks: [ot-dmz, dmz-it]
    mem_limit: 128m
    cpus: 0.5

  # Prometheus on the IT side. Its only way out of the IT network is the
  # dmz-it conduit, where the collector is the only thing to talk to.
  prometheus:
    <<: *hardening
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [dmz-it, it]
    mem_limit: 1g
    cpus: 1.0


  # Routing, grouping and inhibition. IT only: nothing in the DMZ can raise,
  # silence or read an alert.
  alertmanager:
    <<: *hardening
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.1}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [it]
    mem_limit: 128m
    cpus: 0.25

  # Stand-in for the pager, the shift's queue and the log: prints one line per
  # notification. docker compose logs -f webhook-logger
  webhook-logger:
    <<: *hardening
    image: python:${PYTHON_VERSION:-3.12.11-alpine3.22}
    user: "65534:65534"
    init: true
    command: ["python", "-u", "-B", "/app/server.py"]
    volumes:
      - ./tools/webhook-logger:/app:ro
    networks: [it]
    mem_limit: 64m
    cpus: 0.25

  # Tools below aren't started by "up". Run them with: docker compose run --rm <name> ...

  # A laptop on the OT network: reads devices by hand, and stands in for the
  # park controller when writing setpoints
  ot-workstation:
    <<: *python
    profiles: [tools]
    entrypoint: ["python", "-u", "-B", "-m", "fleet.cli"]
    networks: [ot]
    restart: "no"

  # A laptop in the DMZ, same tool: shows what the DMZ side can and can't do
  dmz-workstation:
    <<: *python
    profiles: [tools]
    entrypoint: ["python", "-u", "-B", "-m", "fleet.cli"]
    networks: [ot-dmz]
    restart: "no"

  # Unit tests, run with no network at all
  unit-tests:
    <<: *python
    profiles: [tools]
    command: ["python", "-B", "-m", "unittest", "discover", "-s", "tests", "-v"]
    volumes:
      - ./fleet:/app/fleet:ro
      - ./tests:/app/tests:ro
      - ./inventory.toml:/app/inventory.toml:ro
      - ./collector:/app/collector:ro
      - ./prometheus:/app/prometheus:ro
      - ./docs:/app/docs:ro
    network_mode: none
    restart: "no"

networks:
  # Field devices. internal: true means no route out of this network at all.
  ot:
    internal: true

    # Conduit from OT to the DMZ: the gateway on one side, the collector on the other.
  ot-dmz:
    internal: true

    # Conduit from the DMZ to IT: the collector on one side, Prometheus on the other.
  dmz-it:
    internal: true

  # The IT side. Not internal, because the UIs are published to the host.
  it: {}

volumes:
  prometheus-data:
  alertmanager-data: