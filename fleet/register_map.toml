# Register maps of the simulated devices: what a vendor's Modbus documentation
# would tell you. The simulators encode their values from this file, which
# makes it the contract between the devices and anything that reads them.
#
#   value in the given unit = raw register value x scale
#
# Registers are 16 bits. Wider values span consecutive registers, high word
# first (big-endian, Telegraf byte_order "ABCD"). Word order is the classic
# Modbus trap: vendors disagree on it, so it's always stated in the map.
#
# Input registers (function 04) hold measurements. Holding registers
# (function 03) hold setpoints.

version = 1

# Value of the device_type register for each kind of device
[device_types]
turbine = 1
inverter = 2
battery = 3
substation = 4

# Identity block, the same on every device
[[common]]
name = "heartbeat"
register = "input"
address = 0
type = "UINT32"
unit = "s"
description = "Seconds since the device controller started. Stops changing if the controller hangs."

[[common]]
name = "device_type"
register = "input"
address = 2
type = "UINT16"
description = "Kind of device, see [device_types]"

[[common]]
name = "map_version"
register = "input"
address = 3
type = "UINT16"
description = "Version of this register map the device implements"

# Grid measurements at the device's terminals, the same on every device
[[common]]
name = "frequency"
register = "input"
address = 10
type = "UINT16"
scale = 0.001
unit = "Hz"
description = "Grid frequency"

[[common]]
name = "voltage_l1"
register = "input"
address = 11
type = "FLOAT32"
unit = "V"
description = "Phase L1 to neutral voltage"

[[common]]
name = "voltage_l2"
register = "input"
address = 13
type = "FLOAT32"
unit = "V"
description = "Phase L2 to neutral voltage"

[[common]]
name = "voltage_l3"
register = "input"
address = 15
type = "FLOAT32"
unit = "V"
description = "Phase L3 to neutral voltage"

[[common]]
name = "voltage_nominal"
register = "input"
address = 17
type = "FLOAT32"
unit = "V"
description = "Nominal phase to neutral voltage, so readers can compare in per-unit"

# Output at the device's terminals, generator sign convention: positive means
# delivered to the grid
[[common]]
name = "active_power"
register = "input"
address = 19
type = "INT16"
unit = "kW"
description = "Active power"

[[common]]
name = "reactive_power"
register = "input"
address = 20
type = "INT16"
unit = "kvar"
description = "Reactive power"

[[common]]
name = "rated_power"
register = "input"
address = 21
type = "UINT16"
unit = "kW"
description = "Nameplate active power"

# Wind turbine
[[turbine]]
name = "wind_speed"
register = "input"
address = 30
type = "UINT16"
scale = 0.01
unit = "m/s"
description = "Nacelle anemometer"

[[turbine]]
name = "state"
register = "input"
address = 31
type = "UINT16"
description = "Operating state"
values = { 1 = "producing", 2 = "low wind", 3 = "curtailed", 4 = "storm stop", 5 = "fault", 6 = "maintenance" }

[[turbine]]
name = "rotor_speed"
register = "input"
address = 32
type = "UINT16"
scale = 0.1
unit = "rpm"
description = "Rotor speed"

[[turbine]]
name = "power_limit"
register = "holding"
address = 0
type = "UINT16"
scale = 0.1
unit = "%"
description = "Active power limit from the park controller, in % of rated power. 100 means no limit."
writable = true
minimum = 0.0
maximum = 100.0